[project]
name = "stella"
version = "0.1.0"
description = "Stella voice/phone stack — Telnyx Call Control + Gemini Live, dispatched via MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "websockets>=14.0",
  "mcp>=1.12.0,<2",
  "cryptography>=44.0.0",
  "phonenumbers>=8.13.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
stella = "stella.cli:main"
stella-mcp = "stella.mcp_stdio:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stella*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
